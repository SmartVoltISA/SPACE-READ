name: validate-space-read

on:
  push:
  pull_request:

# This workflow is intentionally read-only. It must never receive a token that
# can write repository contents, issues, releases, or SPACE Core.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate SPACE-READ
        run: python scripts/validate_read.py
      - name: Run isolated adversarial tests
        run: python scripts/test_adversarial.py
